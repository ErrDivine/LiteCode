<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LiteCode</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg-primary: #1a1a2e;
  --bg-secondary: #16213e;
  --bg-tertiary: #1f1f38;
  --border: #2a2a4a;
  --accent: #8be9fd;
  --accent-dim: #5b9bb5;
  --green: #50fa7b;
  --red: #ff6b6b;
  --text: #e0e0e0;
  --text-dim: #999;
  --user-bg: #0f3460;
  --tool-bg: #1a2a1a;
  --tool-border: #2a4a2a;
  --code-bg: #0d1117;
  --code-inline: #2d2d50;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg-primary);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ── Header ── */
#header {
  padding: 10px 20px;
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}

#header .logo {
  font-size: 18px;
  font-weight: 700;
  color: var(--accent);
  font-family: "SF Mono", "Fira Code", monospace;
}

#header .logo span { color: var(--green); }

#status-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--green);
  transition: background 0.3s;
}

#status-dot.streaming {
  background: var(--accent);
  animation: pulse 1.2s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(139,233,253,0.4); }
  50% { opacity: 0.7; box-shadow: 0 0 0 6px rgba(139,233,253,0); }
}

#header .model-name {
  font-size: 12px;
  color: var(--text-dim);
  margin-left: auto;
  font-family: monospace;
}

/* ── Chat area ── */
#chat {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  scroll-behavior: smooth;
  position: relative;
}

/* Custom scrollbar */
#chat::-webkit-scrollbar { width: 6px; }
#chat::-webkit-scrollbar-track { background: transparent; }
#chat::-webkit-scrollbar-thumb { background: #3a3a5a; border-radius: 3px; }
#chat::-webkit-scrollbar-thumb:hover { background: #4a4a6a; }
#chat { scrollbar-width: thin; scrollbar-color: #3a3a5a transparent; }

/* ── Welcome screen ── */
#welcome {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  opacity: 1;
  transition: opacity 0.3s;
}

#welcome.hidden { display: none; }

#welcome h2 {
  font-size: 22px;
  font-weight: 600;
  color: var(--text);
}

#welcome .subtitle {
  color: var(--text-dim);
  font-size: 14px;
}

.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
  max-width: 500px;
}

.chip {
  padding: 8px 14px;
  background: var(--bg-tertiary);
  border: 1px solid var(--border);
  border-radius: 20px;
  font-size: 13px;
  color: var(--text-dim);
  cursor: pointer;
  transition: all 0.2s;
}

.chip:hover {
  border-color: var(--accent);
  color: var(--accent);
  background: rgba(139,233,253,0.05);
}

/* ── Messages ── */
.msg {
  max-width: 80%;
  padding: 12px 16px;
  border-radius: 12px;
  line-height: 1.7;
  word-wrap: break-word;
  animation: fadeIn 0.25s ease-out;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.msg.user {
  align-self: flex-end;
  background: var(--user-bg);
  color: #f0f0f0;
  border-bottom-right-radius: 4px;
  white-space: pre-wrap;
}

.msg.assistant {
  align-self: flex-start;
  background: var(--bg-tertiary);
  border: 1px solid var(--border);
  border-bottom-left-radius: 4px;
}

/* Streaming cursor */
.msg.assistant.streaming .md::after {
  content: "|";
  color: var(--accent);
  animation: blink 0.8s step-end infinite;
  font-weight: 300;
}

@keyframes blink {
  50% { opacity: 0; }
}

/* ── Tool call cards ── */
.msg.tool {
  align-self: flex-start;
  background: var(--tool-bg);
  border: 1px solid var(--tool-border);
  border-radius: 8px;
  font-size: 0.85em;
  max-width: 85%;
  padding: 10px 14px;
}

.tool-header {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 4px;
}

.tool-icon {
  font-family: monospace;
  font-size: 14px;
  width: 22px;
  height: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(80,250,123,0.1);
  border-radius: 4px;
  color: var(--green);
  flex-shrink: 0;
}

.tool-name {
  font-weight: 600;
  color: var(--green);
  font-size: 0.9em;
}

.tool-status {
  margin-left: auto;
  font-size: 0.8em;
  color: var(--text-dim);
}

.tool-spinner {
  display: inline-block;
  width: 12px; height: 12px;
  border: 2px solid var(--tool-border);
  border-top-color: var(--green);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin-right: 4px;
  vertical-align: middle;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.tool-args {
  color: var(--text-dim);
  font-family: monospace;
  font-size: 0.85em;
  white-space: pre-wrap;
  word-break: break-all;
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.3s ease;
  margin-top: 0;
}

.tool-args.expanded {
  max-height: 200px;
  overflow-y: auto;
  margin-top: 6px;
}

.tool-toggle {
  font-size: 11px;
  color: var(--accent-dim);
  cursor: pointer;
  user-select: none;
  margin-top: 4px;
}

.tool-toggle:hover { color: var(--accent); }

.tool-output {
  margin-top: 6px;
  padding-top: 6px;
  border-top: 1px solid var(--tool-border);
  font-family: monospace;
  font-size: 0.85em;
  white-space: pre-wrap;
  word-break: break-all;
  max-height: 200px;
  overflow-y: auto;
  color: #ccc;
}

/* ── Markdown styles ── */
.msg.assistant .md p { margin: 0.5em 0; }
.msg.assistant .md p:first-child { margin-top: 0; }
.msg.assistant .md p:last-child { margin-bottom: 0; }
.msg.assistant .md h1,
.msg.assistant .md h2,
.msg.assistant .md h3 { margin: 0.8em 0 0.4em; color: var(--accent); }
.msg.assistant .md h1 { font-size: 1.3em; }
.msg.assistant .md h2 { font-size: 1.15em; }
.msg.assistant .md h3 { font-size: 1.05em; }
.msg.assistant .md ul,
.msg.assistant .md ol { padding-left: 1.5em; margin: 0.5em 0; }
.msg.assistant .md li { margin: 0.2em 0; }
.msg.assistant .md code {
  background: var(--code-inline);
  padding: 2px 6px;
  border-radius: 4px;
  font-size: 0.88em;
  color: #f8f8f2;
}
.msg.assistant .md pre {
  background: var(--code-bg);
  padding: 12px;
  border-radius: 8px;
  overflow-x: auto;
  margin: 0.5em 0;
  position: relative;
}
.msg.assistant .md pre code {
  background: none;
  padding: 0;
  color: inherit;
}
.msg.assistant .md blockquote {
  border-left: 3px solid var(--accent);
  padding-left: 12px;
  color: #aaa;
  margin: 0.5em 0;
}
.msg.assistant .md table {
  border-collapse: collapse;
  margin: 0.5em 0;
  width: 100%;
}
.msg.assistant .md th {
  border: 1px solid var(--border);
  padding: 6px 10px;
  background: rgba(139,233,253,0.08);
  text-align: left;
}
.msg.assistant .md td {
  border: 1px solid var(--border);
  padding: 6px 10px;
}
.msg.assistant .md tr:nth-child(even) td {
  background: rgba(255,255,255,0.02);
}
.msg.assistant .md a { color: var(--accent); text-decoration: none; }
.msg.assistant .md a:hover { text-decoration: underline; }
.msg.assistant .md hr {
  border: none;
  border-top: 1px solid var(--border);
  margin: 1em 0;
}
.msg.assistant .md strong { color: #fff; }

/* ── Copy button on code blocks ── */
.copy-btn {
  position: absolute;
  top: 6px;
  right: 6px;
  padding: 3px 8px;
  font-size: 11px;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 4px;
  color: var(--text-dim);
  cursor: pointer;
  opacity: 0;
  transition: opacity 0.2s;
}

.msg.assistant .md pre:hover .copy-btn { opacity: 1; }
.copy-btn:hover { background: rgba(255,255,255,0.15); color: #fff; }
.copy-btn.copied { color: var(--green); border-color: var(--green); }

/* ── Error message ── */
.msg.error {
  align-self: center;
  background: #3d1010;
  border: 1px solid #6b2020;
  color: var(--red);
  font-size: 0.9em;
}

/* ── Scroll-to-bottom button ── */
#scroll-btn {
  position: absolute;
  bottom: 10px;
  left: 50%;
  transform: translateX(-50%);
  padding: 6px 14px;
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: 16px;
  color: var(--text-dim);
  font-size: 12px;
  cursor: pointer;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s;
  z-index: 10;
}

#scroll-btn.visible {
  opacity: 1;
  pointer-events: auto;
}

#scroll-btn:hover { border-color: var(--accent); color: var(--accent); }

/* ── Input area ── */
#input-area {
  padding: 14px 20px;
  background: var(--bg-secondary);
  border-top: 1px solid var(--border);
  display: flex;
  gap: 10px;
  flex-shrink: 0;
}

#input-wrap {
  flex: 1;
  position: relative;
}

#input {
  width: 100%;
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--bg-primary);
  color: var(--text);
  font-size: 14px;
  font-family: inherit;
  resize: none;
  min-height: 44px;
  max-height: 150px;
  transition: border-color 0.2s, box-shadow 0.2s;
}

#input:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 2px rgba(139,233,253,0.15);
}

#hint {
  position: absolute;
  bottom: -18px;
  left: 4px;
  font-size: 11px;
  color: var(--text-dim);
  opacity: 0.6;
  transition: opacity 0.5s;
}

#hint.hidden { opacity: 0; pointer-events: none; }

#send {
  padding: 10px 20px;
  background: var(--user-bg);
  color: #fff;
  border: none;
  border-radius: 10px;
  font-size: 14px;
  cursor: pointer;
  align-self: flex-end;
  transition: background 0.2s;
  min-width: 64px;
}

#send:hover { background: #1a4a8a; }
#send:disabled { opacity: 0.5; cursor: not-allowed; }

/* ── Responsive ── */
@media (max-width: 600px) {
  .msg { max-width: 95%; }
  .msg.tool { max-width: 98%; }
  #header .model-name { display: none; }
}
</style>
</head>
<body>

<div id="header">
  <div class="logo"><span>&gt;_</span> LiteCode</div>
  <div id="status-dot"></div>
  <div class="model-name" id="model-label"></div>
</div>

<div id="chat">
  <div id="welcome">
    <h2>What can I help you with?</h2>
    <p class="subtitle">LiteCode is a coding agent with file and shell access.</p>
    <div class="chips">
      <div class="chip" onclick="useChip(this)">Explain this project structure</div>
      <div class="chip" onclick="useChip(this)">Find all TODO comments</div>
      <div class="chip" onclick="useChip(this)">Write a unit test for main</div>
    </div>
  </div>
  <div id="scroll-btn" onclick="scrollBottom()">Scroll to bottom</div>
</div>

<div id="input-area">
  <div id="input-wrap">
    <textarea id="input" rows="1" placeholder="Type a message..." autofocus></textarea>
    <div id="hint">Enter to send, Shift+Enter for newline</div>
  </div>
  <button id="send">Send</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
marked.setOptions({
  highlight: function(code, lang) {
    if (lang && hljs.getLanguage(lang)) {
      return hljs.highlight(code, { language: lang }).value;
    }
    return hljs.highlightAuto(code).value;
  },
  breaks: true,
});

const chat = document.getElementById("chat");
const inputEl = document.getElementById("input");
const sendBtn = document.getElementById("send");
const welcomeEl = document.getElementById("welcome");
const statusDot = document.getElementById("status-dot");
const scrollBtnEl = document.getElementById("scroll-btn");
const hintEl = document.getElementById("hint");

const messages = [];
let streaming = false;
let firstSend = true;

const TOOL_ICONS = {
  shell: "$",
  read_file: "\u{1F4C4}",
  write_file: "\u{270F}",
  edit_file: "\u{2702}",
  list_directory: "\u{1F4C1}",
  search_files: "\u{1F50D}",
  find_files: "\u{1F50E}",
};

function scrollBottom() {
  chat.scrollTo({ top: chat.scrollHeight, behavior: "smooth" });
}

// Show/hide scroll-to-bottom button
chat.addEventListener("scroll", () => {
  const gap = chat.scrollHeight - chat.scrollTop - chat.clientHeight;
  scrollBtnEl.classList.toggle("visible", gap > 150);
});

function hideWelcome() {
  if (welcomeEl && !welcomeEl.classList.contains("hidden")) {
    welcomeEl.classList.add("hidden");
  }
}

function useChip(el) {
  inputEl.value = el.textContent;
  inputEl.focus();
  sendMessage();
}

function setStreaming(on) {
  streaming = on;
  sendBtn.disabled = on;
  sendBtn.textContent = on ? "..." : "Send";
  statusDot.classList.toggle("streaming", on);
}

function addUserMsg(text) {
  hideWelcome();
  const div = document.createElement("div");
  div.className = "msg user";
  div.textContent = text;
  chat.appendChild(div);
  scrollBottom();
}

function addAssistantMsg() {
  const div = document.createElement("div");
  div.className = "msg assistant streaming";
  const md = document.createElement("div");
  md.className = "md";
  div.appendChild(md);
  chat.appendChild(div);
  scrollBottom();
  return div;
}

function updateAssistantMsg(div, text) {
  const md = div.querySelector(".md");
  md.innerHTML = marked.parse(text);
  injectCopyButtons(md);
  scrollBottom();
}

function finishAssistantMsg(div) {
  div.classList.remove("streaming");
}

function injectCopyButtons(container) {
  container.querySelectorAll("pre").forEach(pre => {
    if (pre.querySelector(".copy-btn")) return;
    const btn = document.createElement("button");
    btn.className = "copy-btn";
    btn.textContent = "Copy";
    btn.onclick = () => {
      const code = pre.querySelector("code");
      navigator.clipboard.writeText(code ? code.textContent : pre.textContent).then(() => {
        btn.textContent = "Copied!";
        btn.classList.add("copied");
        setTimeout(() => { btn.textContent = "Copy"; btn.classList.remove("copied"); }, 1500);
      });
    };
    pre.style.position = "relative";
    pre.appendChild(btn);
  });
}

function addToolMsg(name, args) {
  const div = document.createElement("div");
  div.className = "msg tool";
  div._startTime = Date.now();

  const icon = TOOL_ICONS[name] || "\u{2699}";
  let argsDisplay = args;
  try { argsDisplay = JSON.stringify(JSON.parse(args), null, 2); } catch(e) {}

  div.innerHTML =
    '<div class="tool-header">' +
      '<div class="tool-icon">' + icon + '</div>' +
      '<span class="tool-name">' + escapeHtml(name) + '</span>' +
      '<span class="tool-status"><span class="tool-spinner"></span> running</span>' +
    '</div>' +
    '<div class="tool-toggle" onclick="this.nextElementSibling.classList.toggle(\'expanded\'); this.textContent = this.nextElementSibling.classList.contains(\'expanded\') ? \'hide args\' : \'show args\'">show args</div>' +
    '<div class="tool-args">' + escapeHtml(argsDisplay) + '</div>' +
    '<div class="tool-output"></div>';
  chat.appendChild(div);
  scrollBottom();
  return div;
}

function finishToolMsg(div, output) {
  const elapsed = ((Date.now() - (div._startTime || Date.now())) / 1000).toFixed(1);
  const status = div.querySelector(".tool-status");
  if (status) status.innerHTML = '<span style="color:var(--green)">done</span> <span style="color:var(--text-dim);font-size:0.9em">' + elapsed + 's</span>';
  const out = div.querySelector(".tool-output");
  out.textContent = output.length > 2000 ? output.slice(0, 2000) + "\n... (truncated)" : output;
  scrollBottom();
}

function addErrorMsg(text) {
  const div = document.createElement("div");
  div.className = "msg error";
  div.textContent = text;
  chat.appendChild(div);
  scrollBottom();
}

function escapeHtml(s) {
  const d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}

async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text || streaming) return;

  if (firstSend) {
    firstSend = false;
    hintEl.classList.add("hidden");
  }

  inputEl.value = "";
  inputEl.style.height = "auto";
  addUserMsg(text);
  messages.push({ role: "user", content: text });

  setStreaming(true);

  let assistantDiv = null;
  let fullText = "";
  let currentToolDiv = null;

  try {
    const resp = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages }),
    });

    if (!resp.ok) throw new Error("HTTP " + resp.status);

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    let currentEvent = "";

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split("\n");
      buffer = lines.pop();

      for (const line of lines) {
        if (line.startsWith("event:")) {
          currentEvent = line.slice(6).trim();
          continue;
        }

        if (!line.startsWith("data:")) continue;
        const raw = line.slice(5).trim();
        if (raw === "[DONE]") continue;

        let parsed;
        try { parsed = JSON.parse(raw); } catch(e) { continue; }

        if (currentEvent === "error" || parsed.error) {
          addErrorMsg(parsed.error || "Unknown error");
          continue;
        }

        if (currentEvent === "delta") {
          if (parsed.content) {
            if (!assistantDiv) assistantDiv = addAssistantMsg();
            fullText += parsed.content;
            updateAssistantMsg(assistantDiv, fullText);
          }
        } else if (currentEvent === "tool_start") {
          if (assistantDiv) {
            finishAssistantMsg(assistantDiv);
          }
          assistantDiv = null;
          fullText = "";
          currentToolDiv = addToolMsg(parsed.name, parsed.arguments);
        } else if (currentEvent === "tool_end") {
          if (currentToolDiv) {
            finishToolMsg(currentToolDiv, parsed.output);
            currentToolDiv = null;
          }
        }

        currentEvent = "";
      }
    }
  } catch (e) {
    addErrorMsg("Connection error: " + e.message);
  }

  if (assistantDiv) finishAssistantMsg(assistantDiv);

  if (fullText) {
    messages.push({ role: "assistant", content: fullText });
  } else if (assistantDiv && !assistantDiv.querySelector(".md").innerHTML.trim()) {
    assistantDiv.remove();
  }

  setStreaming(false);
  inputEl.focus();
}

sendBtn.addEventListener("click", sendMessage);
inputEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

inputEl.addEventListener("input", () => {
  inputEl.style.height = "auto";
  inputEl.style.height = Math.min(inputEl.scrollHeight, 150) + "px";
});
</script>
</body>
</html>
