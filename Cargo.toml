[workspace]
members = [
  ".",
  "crates/openai-rs",
  "crates/protocol",
  "crates/rollout",
  "crates/thread-store",
  "crates/state-store",
  "crates/session-kernel",
  "crates/scheduler",
  "crates/status",
  "crates/ui-bridge",
  "crates/pave-router",
]
resolver = "3"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["stream", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
http = "1"
bytes = "1"
futures = "0.3"
async-trait = "0.1"
eventsource-stream = "0.2"
rand = "0.9"
tempfile = "3"

[package]
name = "lite-code"
version = "0.1.0"
edition = "2024"
description = "Local Marvis coding-agent runtime with CLI, web, and VSCode entrypoints"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = "1"
glob = "0.3"
regex = "1"
futures = { workspace = true }
axum = "0.8"
tokio-stream = "0.1"
async-trait = { workspace = true }
protocol = { path = "crates/protocol" }
rollout = { path = "crates/rollout" }
session-kernel = { path = "crates/session-kernel" }
scheduler = { path = "crates/scheduler" }
status = { path = "crates/status" }
ui-bridge = { path = "crates/ui-bridge" }
pave-router = { path = "crates/pave-router" }
openai-rs = { path = "crates/openai-rs" }
